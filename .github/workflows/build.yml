name: Build & Release

# Neue Version veröffentlichen: "version" in package.json erhöhen und auf main pushen.
# Gibt es zu dieser Version noch kein Release, baut GitHub die Installer für Mac und
# Windows und veröffentlicht sie automatisch auf der Release-Seite.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # latest.yml und .blockmap braucht die automatische Update-Funktion unter Windows
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KursHamster ${{ needs.check.outputs.version }}
          files: installers/*
          body: |
            **Windows:** `KursHamster-${{ needs.check.outputs.version }}-Windows-Setup.exe` herunterladen und doppelklicken. Bei „Der Computer wurde durch Windows geschützt“: „Weitere Informationen“ → „Trotzdem ausführen“.

            **Mac:** `KursHamster-${{ needs.check.outputs.version }}-Mac.dmg` öffnen und die App in *Programme* ziehen. Beim ersten Start: *Systemeinstellungen → Datenschutz & Sicherheit* → „Dennoch öffnen“.

            ---

            **Windows:** download `KursHamster-${{ needs.check.outputs.version }}-Windows-Setup.exe` and double-click it. If you see “Windows protected your PC”: “More info” → “Run anyway”.

            **Mac:** open `KursHamster-${{ needs.check.outputs.version }}-Mac.dmg` and drag the app into *Applications*. On first launch: *System Settings → Privacy & Security* → “Open Anyway”.
