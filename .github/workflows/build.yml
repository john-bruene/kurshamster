name: Build & Release

# Neue Version veröffentlichen:
#   1. "version" in package.json erhöhen
#   2. Abschnitt "## <version>" in CHANGELOG.md ergänzen
#   3. auf main pushen
# Gibt es zu dieser Version noch kein Release, baut GitHub die Installer für Mac und
# Windows und veröffentlicht sie auf der Release-Seite.
#
# Signatur (optional, siehe CONTRIBUTING.md): Sind die Secrets für das Apple-Zertifikat
# hinterlegt, wird die Mac-App signiert und notarisiert, sonst nur ad hoc signiert.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Installer bauen (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Installer bauen (Mac)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Apple-Zertifikat vorhanden: signieren und notarisieren"
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.mac.identity;p.build.mac.hardenedRuntime=true;p.build.mac.notarize=true;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          else
            echo "Kein Apple-Zertifikat: nur Ad-hoc-Signatur"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # latest.yml und .blockmap braucht die automatische Update-Funktion unter Windows
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Text für die Release-Seite
        run: |
          V="${{ needs.check.outputs.version }}"
          # Abschnitt "## $V" aus CHANGELOG.md bis zur nächsten Überschrift
          NOTES=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          {
            echo "## Herunterladen"
            echo
            echo "- **Windows:** [KursHamster-Windows-Setup.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/KursHamster-Windows-Setup.exe)"
            echo "- **Mac:** [KursHamster-Mac.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/KursHamster-Mac.dmg)"
            echo
            echo "Anleitung zur Installation: [README](https://github.com/${GITHUB_REPOSITORY}#installieren)"
            echo
            if [ -n "$NOTES" ]; then
              echo "## Neu in Version $V"
              echo "$NOTES"
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KursHamster ${{ needs.check.outputs.version }}
          body_path: release-notes.md
          files: installers/*
